[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "sara-wpbrigade", email = "sara.nadeem@wpbrigade.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anomalib[cpu]>=2.7.0",
    "fastapi>=0.128.8",
    "google-genai>=3.3.0",
    "numpy>=2.5.5",
    "pydantic-settings>=2.11.0",
    "python-multipart>=0.0.34",
    "uvicorn[standard]>=0.39.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "pyright>=1.1.414",
    "pytest>=8.4.2",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.pyright]
include = ["app", "tests"]
typeCheckingMode = "standard"
